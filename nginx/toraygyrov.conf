# Конфигурация Nginx для энциклопедии Торайгырова
# Место: C:\nginx\conf\sites-available\toraygyrov.conf
#
# Инструкция по подключению:
# 1. Скопируй этот файл в C:\nginx\conf\sites-available\
# 2. В C:\nginx\conf\nginx.conf добавь в блок http:
#    include C:/nginx/conf/sites-available/*.conf;
# 3. Проверь: .\nginx.exe -t
# 4. Перезагрузи: Restart-Service nginx

# ================================================================
# UPSTREAM: Подключение к Node.js приложению
# ================================================================
upstream nodejs_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ================================================================
# РЕДИРЕКТ с HTTP на HTTPS (включи если у тебя есть SSL сертификат)
# ================================================================
server {
    listen 80;
    server_name yourdomain.com 192.168.x.x;  # Меняй на свой домен/IP

    # Для Let's Encrypt проверки (если будешь использовать SSL)
    location /.well-known/acme-challenge/ {
        root C:/nginx/html;
        try_files $uri =404;
    }

    # Редирект на HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ================================================================
# ОСНОВНОЙ СЕРВЕР (HTTPS + HTTP если нет SSL)
# ================================================================

# Раскомментируй строку ниже если используешь HTTPS с SSL
# server {
#     listen 443 ssl http2;

# Раскомментируй строку ниже если используешь только HTTP без SSL
server {
    listen 80;

    # ЕСЛИ ИСПОЛЬЗУЕШЬ SSL, РАСКОММЕНТИРУЙ ЭТО:
    # server_name yourdomain.com www.yourdomain.com;
    # ssl_certificate /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    # ЕСЛИ НЕ ИСПОЛЬЗУЕШЬ SSL:
    server_name yourdomain.com 192.168.x.x;  # Меняй на свой домен/IP

    # ================================================================
    # Безопасность и заголовки
    # ================================================================

    # CORS и безопасность (раскомментируй если нужно)
    # add_header Access-Control-Allow-Origin *;
    # add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
    # add_header Access-Control-Allow-Headers "Content-Type, Authorization";

    # Для HTTPS (раскомментируй если используешь SSL)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Отключи Server header (безопасность)
    server_tokens off;

    # ================================================================
    # Размер загружаемых файлов
    # ================================================================
    client_max_body_size 500M;  # Для видео
    client_body_timeout 600s;
    client_header_timeout 60s;

    # ================================================================
    # ОСНОВНОЙ REVERSE PROXY НА Node.js
    # ================================================================
    location / {
        proxy_pass http://nodejs_backend;
        proxy_http_version 1.1;

        # Websockets (для real-time функций)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Основные заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Отключи кэширование прокси для динамического контента
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;

        # Таймауты для больших файлов
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Буферизация
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ================================================================
    # Кэширование статических файлов
    # ================================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|otf|mp4)$ {
        proxy_pass http://nodejs_backend;

        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Pragma "public";

        # Для статических файлов из .next
        access_log off;
        log_not_found off;
    }

    # ================================================================
    # Отключение доступа к системным файлам
    # ================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ================================================================
    # Логирование
    # ================================================================
    access_log C:/nginx/logs/toraygyrov-access.log combined;
    error_log C:/nginx/logs/toraygyrov-error.log warn;

    # Форма логов (обычно достаточно):
    # $remote_addr - IP клиента
    # $remote_user - пользователь (если авторизован)
    # [$time_local] - время запроса
    # "$request" - HTTP запрос (GET /path HTTP/1.1)
    # $status - HTTP статус (200, 404, 500)
    # $body_bytes_sent - размер ответа
    # "$http_referer" - откуда пришёл (реферер)
    # "$http_user_agent" - браузер клиента

    # ================================================================
    # Gzip сжатие (опционально, но рекомендуется)
    # ================================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/atom+xml image/svg+xml
               application/javascript application/json;
    gzip_disable "msie6";
    gzip_comp_level 6;
}

# ================================================================
# ДОПОЛНИТЕЛЬНЫЕ ПАРАМЕТРЫ (добавь в http блок nginx.conf если нужно)
# ================================================================

# # Ограничение скорости (от DDoS)
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
#
# # В блоке server:
# location /api/ {
#     limit_req zone=api_limit burst=20 nodelay;
#     proxy_pass http://nodejs_backend;
# }

# ================================================================
# ПРИМЕЧАНИЯ
# ================================================================
#
# 1. Меняй "yourdomain.com" на свой домен/IP
# 2. Если используешь SSL, раскомментируй строки с "ssl_certificate"
# 3. Проверь путь к логам (должны существовать папка C:\nginx\logs)
# 4. После изменений выполни: .\nginx.exe -t && Restart-Service nginx
# 5. Для Let's Encrypt SSL используй: certbot certonly --webroot ...
#
# Команды управления Nginx:
# - Проверка конфига: C:\nginx\nginx.exe -t
# - Перезагрузка: Restart-Service nginx
# - Остановка: Stop-Service nginx
# - Старт: Start-Service nginx
# - Просмотр процесса: tasklist | findstr nginx
#
